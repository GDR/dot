default_stages: [pre-commit]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.4.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files

- repo: local
  hooks:
  - id: gitleaks
    name: Gitleaks Secret Scan
    entry: gitleaks git --pre-commit --staged --redact --no-banner
    language: system
    pass_filenames: false
    always_run: true

  - id: nixfmt
    name: Nixfmt (RFC 166)
    entry: nixfmt --check
    language: system
    files: \.nix$

  - id: deadnix
    name: Deadnix
    entry: deadnix --fail --no-lambda-pattern-names --no-lambda-arg .
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit]

  - id: statix
    name: Statix
    entry: statix check .
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit]

  # Run current-platform flake check on push (multi-system checks run in CI)
  - id: nix-flake-check
    name: Nix Flake Check
    entry: nix flake check
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-push]
