name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Gitleaks Secret Check
        run: nix develop -c gitleaks git --redact --no-banner .
      - name: Nixfmt Format Check
        run: nix develop -c treefmt --fail-on-change --no-cache
      - name: Deadnix Check
        run: nix develop -c deadnix --fail --no-lambda-pattern-names --no-lambda-arg .
      - name: Statix Check
        run: nix develop -c statix check .
      - name: Actionlint
        run: nix develop -c actionlint

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Flake Check
        run: |
          nix flake check
          nix eval --json .#checks.aarch64-darwin --apply 'c: builtins.mapAttrs (_: v: v.drvPath) c'

  eval-hosts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build nix-goldstar (dry-run)
        run: nix build .#nixosConfigurations.nix-goldstar.config.system.build.toplevel --dry-run
      - name: Build nix-oldstar (dry-run)
        run: nix build .#nixosConfigurations.nix-oldstar.config.system.build.toplevel --dry-run
      - name: Eval mac-brightstar drvPath
        run: nix eval .#darwinConfigurations.mac-brightstar.config.system.build.toplevel.drvPath
